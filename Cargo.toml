[package]
name = "ftnl-lib-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "JSON Schema driven code, SQL, and ORM foundation for File Tunnel"
repository = "https://github.com/file-tunnel/ftnl-lib-core"

[features]
default = ["read-only"]
read-only = []
read-write = ["read-only"]

[dependencies]
jsonschema = { version = "0.49.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
